name: switch-nro

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  workflow_dispatch:
    inputs:
      libnx_ref:
        description: libnx branch/tag to build against
        default: master
      release_tag:
        description: Publish the build as a release with this tag (created at the built commit); empty skips it
        default: ""

permissions:
  contents: write

jobs:
  nro:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build NXVK toolchain image
        run: |
          git clone --depth 1 -b switch https://github.com/PalindromicBreadLoaf/nxvk.git externals/nxvk
          docker build -t nxvk externals/nxvk/switch/docker
      - name: Build dekopon.nro
        run: docker run --rm -e LIBNX_REF="${{ inputs.libnx_ref || 'master' }}" -v "$PWD:/work" -w /work nxvk bash .ci/switch-nro.sh
      - uses: actions/upload-artifact@v7
        with:
          name: EmuSwitch
          path: artifacts/EmuSwitch.nro
      - name: Publish nightly
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1 ||             gh release create nightly --repo "${{ github.repository }}" --prerelease --title "Nightly"               --notes "Latest master build, rebuilt against libnx master for HOS 22.5.0."
          gh release upload nightly artifacts/EmuSwitch.nro --clobber --repo "${{ github.repository }}"
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: gh release create "$TAG" artifacts/EmuSwitch.nro --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$TAG" --notes "Rebuilt against libnx master and the latest devkitA64 for HOS 22.5.0 / Atmosphère 1.11.2."
